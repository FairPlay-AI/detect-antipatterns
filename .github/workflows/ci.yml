# Basic CI for detect-antipatterns.
#
# Two jobs:
#   1. test  — pytest against the package.
#   2. scan  — dogfooding via slop-detect (which itself uses DAP).
#              This is the "checker has no checker errors" guarantee.
#              If a structure or type-and-structure regression lands,
#              the scan job fails on PR.
#
# Output of the scan job:
#   - SARIF uploaded as a workflow artifact (always works on any plan).
#   - SARIF uploaded to GitHub Code Scanning if the repo has Advanced
#     Security enabled. Tolerated as non-fatal so the workflow stays
#     green on private repos without GHAS.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required for github/codeql-action/upload-sarif on repos with GHAS.
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        run: pytest -v

  scan:
    # Dogfooding: run DAP and Ruff over our own source. Two separate
    # invocations because the full ai-slop-detector pipeline (which
    # bundles them together) is in a private repo and the default
    # GITHUB_TOKEN can't clone it. If GHAS / a PAT becomes available,
    # this job can be upgraded to call slop-detect directly.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff
        # Uses ./ruff.toml — structural / type-and-structure rules,
        # not style. Mirrors a subset of ai-slop-detector's ruff-slop.toml.
        run: |
          ruff check detect_antipatterns/ --config ruff.toml

      - name: DAP self-scan
        run: |
          python -m detect_antipatterns detect_antipatterns/
