# Basic CI for detect-antipatterns.
#
# Two jobs:
#   1. test  — pytest against the package.
#   2. scan  — dogfooding via slop-detect (which itself uses DAP).
#              This is the "checker has no checker errors" guarantee.
#              If a structure or type-and-structure regression lands,
#              the scan job fails on PR.
#
# Output of the scan job:
#   - SARIF uploaded as a workflow artifact (always works on any plan).
#   - SARIF uploaded to GitHub Code Scanning if the repo has Advanced
#     Security enabled. Tolerated as non-fatal so the workflow stays
#     green on private repos without GHAS.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required for github/codeql-action/upload-sarif on repos with GHAS.
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        run: pytest -v

  scan:
    runs-on: ubuntu-latest
    env:
      SCAN_TARGET: ${{ github.workspace }}/detect_antipatterns
      SCAN_PACKAGE: detect_antipatterns
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ai-slop-detector + this PR's detect-antipatterns
        run: |
          python -m pip install --upgrade pip
          # Install ai-slop-detector first — it pulls a DAP from main as
          # a transitive dep. Then install the PR's checkout editable
          # afterwards, so the editable install OVERRIDES the transitive
          # one. This guarantees the scan runs against the code under
          # review, not against main.
          pip install git+https://github.com/FairPlay-AI/ai-slop-detector.git
          pip install -e . --force-reinstall --no-deps

      - name: Run scan
        id: scan
        run: |
          mkdir -p out
          slop-detect "$SCAN_TARGET" \
            --package "$SCAN_PACKAGE" \
            --summary \
            -o out/slop.sarif 2> >(tee -a $GITHUB_STEP_SUMMARY >&2)

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dap-self-scan
          path: out/slop.sarif
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/slop.sarif
          category: detect-antipatterns
